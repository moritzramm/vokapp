<!doctype html>
<html lang="de" class="wa-theme-default wa-palette-default wa-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Eigene Vokabeln verwalten und mit Karteikarten lernen – synchron auf allen Geräten." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Vokabeltrainer</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var choice = JSON.parse(localStorage.getItem('vokabel-app:theme') || '"system"');
          var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('wa-dark', dark);
          document.documentElement.classList.toggle('wa-light', !dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
