<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .side { fill: #16215a; }
    .edge { fill: #0d1640; }
    .hi { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .side { fill: #3a4fb8; }
      .edge { fill: #2a3a8c; }
    }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa2ff"/>
      <stop offset=".45" stop-color="#3d5fd6"/>
      <stop offset="1" stop-color="#2446b0"/>
    </linearGradient>
  </defs>
  <!-- extrusion: finely stacked copies of the V shifted down-right, darkest at the back -->
  <path class="edge" transform="translate(5.5 6.6)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
  <g class="side">
    <path transform="translate(5.0 6.0)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(4.5 5.4)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(4.0 4.8)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(3.5 4.2)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(3.0 3.6)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(2.5 3.0)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(2.0 2.4)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(1.5 1.8)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(1.0 1.2)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
    <path transform="translate(0.5 0.6)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
  </g>
  <!-- front face -->
  <path fill="url(#face)" d="M4 6h15l13 33L45 6h15L40 57H24z"/>
  <!-- light catching the top-left bevel -->
  <path class="hi" opacity=".45" d="M4 6h15l-.8 2H6.9L25.4 55H24z"/>
  <path class="hi" opacity=".3" d="M45 6h15l-.9 2H46.2z"/>
